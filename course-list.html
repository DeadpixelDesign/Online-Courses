<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- Add the XLSX library for reading Excel files -->
    <!-- Course list-->

    <style>
        .category-filter {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .category-filter input[type="checkbox"] {
            margin: 0;
            vertical-align: middle;
        }

        .category-filter label {
            margin-top: 5px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .page-button {
            margin-right: 3px;
        }

        .page-button:last-child {
            margin-right: 0;
        }
    </style>

    <div class="container">

        <div class="row">
            <!-- Filter Side Column -->
            <div class="col-md-3">
                <h2 class="text-blue">Filter by Status</h2>
                <div id="status-filter" class="mb-4">
                    <div>
                        <input type="radio" name="status" value="all" id="all" checked placeholder="all">
                        <label for="all">All</label>
                    </div>
                    <div>
                        <input type="radio" name="status" value="live" id="live" placeholder="live">
                        <label for="live">In-Person</label>
                    </div>
                    <div>
                        <input type="radio" name="status" value="online" id="online" placeholder="online">
                        <label for="online">Online</label>
                    </div>
                    <div>
                        <input type="radio" name="status" value="ondemand" id="ondemand" placeholder="ondemand">
                        <label for="online">On-Demand</label>
                    </div>
                </div>

                <h2 class="text-blue">Filter by Category</h2>
                <div id="filter-container" class="mb-4"></div>
                <button id="deselect-all" class="btn btn-light">Deselect All</button>
            </div>

            <!-- Course List Column -->
            <div class="col-md-9">
                <div id="courses"></div>
                <div id="pagination" class="mb-5"></div>
            </div>
        </div>

    </div><!--end container-->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js" defer></script>

    <script>
        let currentPage = 1;
        const itemsPerPage = 10;
        let totalPages = 0;
        let excelData = [];
        let uniqueCategories = new Set();
        let selectedCategories = new Set();
        let selectedStatus = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            // Fetch Excel data
            fetch('course_list.xlsx')
                .then(response => response.arrayBuffer())
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    excelData = XLSX.utils.sheet_to_json(firstSheet, { raw: true });

                    // Log the keys of the first row to debug column names
                    if (excelData.length > 0) {
                        console.log(Object.keys(excelData[0]));
                    }

                    // Extract unique categories
                    excelData.forEach(row => {
                        if (row.course_categories) {
                            row.course_categories.split(';').forEach(category => {
                                uniqueCategories.add(category.trim());
                            });
                        }
                    });

                    // Sort courses by start date
                    excelData.sort((a, b) => {
                        const dateA = new Date(a.course_start_date);
                        const dateB = new Date(b.course_start_date);
                        return dateA - dateB;
                    });

                    // Convert the set to an array and sort it alphabetically
                    const sortedCategories = Array.from(uniqueCategories).sort();

                    // Generate category filter checkboxes
                    generateCategoryFilters(sortedCategories);

                    totalPages = Math.ceil(excelData.length / itemsPerPage);
                    displayPage(currentPage);
                })
                .catch(error => console.error('Error reading Excel file:', error));
        });

        function generateCategoryFilters(categories) {
            const filterContainer = document.getElementById('filter-container');
            categories.forEach(category => {
                const wrapper = document.createElement('div');
                wrapper.classList.add('category-filter');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = category;
                checkbox.id = category;
                checkbox.addEventListener('change', handleCategoryFilterChange);
                const label = document.createElement('label');
                label.htmlFor = category;
                label.textContent = category;
                wrapper.appendChild(checkbox);
                wrapper.appendChild(label);
                filterContainer.appendChild(wrapper);
            });
        }

        function handleCategoryFilterChange(event) {
            const category = event.target.value;
            if (event.target.checked) {
                selectedCategories.add(category);
            } else {
                selectedCategories.delete(category);
            }
            displayPage(1); // Reset to the first page on filter change
        }

        document.getElementById('deselect-all').addEventListener('click', () => {
            selectedCategories.clear();
            document.querySelectorAll('#filter-container input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
            });
            displayPage(1); // Reset to the first page on filter change
        });

        document.querySelectorAll('#status-filter input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', event => {
                selectedStatus = event.target.value;
                displayPage(1); // Reset to the first page on filter change
            });
        });

        function parseDate(date) {
            if (typeof date === 'number') {
                // If the date is in Excel serial date format
                const parsedDate = XLSX.SSF.parse_date_code(date);
                return new Date(parsedDate.y, parsedDate.m - 1, parsedDate.d);
            } else {
                // If the date is in string format
                return new Date(date);
            }
        }

        function displayPage(page) {
            const container = document.getElementById('courses');
            container.innerHTML = '';
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = excelData.slice(start, end);
            let hasResults = false;

            pageData.forEach(row => {
                const courseStartDate = parseDate(row.course_start_date);
                const courseEndDate = parseDate(row.course_end_date);

                if (isNaN(courseStartDate.getTime()) || isNaN(courseEndDate.getTime())) {
                    console.error('Invalid date:', row.course_start_date, row.course_end_date);
                    return;
                }

                let courseStatus;
                if (row.online_bool === true) {
                    courseStatus = 'online';
                } else {
                    courseStatus = 'in-person';
                }

                const rowCategories = row.course_categories ? row.course_categories.split(';').map(c => c.trim()) : [];
                const matchesCategory = selectedCategories.size === 0 || [...selectedCategories].some(category => rowCategories.includes(category));
                const matchesStatus = selectedStatus === 'all' || (selectedStatus === 'online' && row.online_bool) || (selectedStatus === 'in-person' && !row.online_bool);
                if (!matchesStatus || !matchesCategory) return;
                hasResults = true;

                const formattedStartDate = !isNaN(courseStartDate.getTime()) ? courseStartDate.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                }) : 'N/A';

                // Check if the image URL is valid, otherwise use the default image
                const imageUrl = row.course_img_src ? row.course_img_src : 'https://www.4spe.org/images/events/spe-course-temp.webp';

                // Check if the course URL is valid, otherwise use javascript:void(0)
                const courseUrl = row.course_url ? row.course_url : 'javascript:void(0)';

                // Determine the course type text
                const courseTypeText = row.online_bool ? '<i class="bi bi-wifi"> </i> Online' : '<i class="bi bi-people-fill"> </i> In-Person';

                const courseElement = document.createElement('article');
                courseElement.classList.add('mb-3');
                courseElement.innerHTML = `
                <a class="link-dark-grey status-${courseStatus}" href="${courseUrl}" target="_blank">
                    <div class="card">
                        <div class="row no-gutters">
                            <div class="col-md-2" style="background-image: url('${imageUrl}'); background-position: center center; background-size: cover;">
                                <img alt="${row.course_title}" class="img-fluid" src="https://www.4spe.org/images/events/event-catalog/bg-transparent.png" style="width: 100%; max-width: 180px; height: auto;">
                            </div>
                            <div class="col-md-10">
                                <div class="card-body">
                                    <h5 class="card-title text-blue">${row.course_title}</h5>
                                    <div class="row row-cols-1 row-cols-md-2" style="color: var(--spe-grey-dark) !important;">
                                        <div class="col">
                                            <p class="card-text mb-0"><strong><i class="bi bi-calendar2-event"> </i> Start Date:</strong> ${formattedStartDate}</p>
                                            <p class="card-text mb-0"><strong><i class="bi bi-person-badge"> </i> Instructor:</strong> ${row.instructor}</p>
                                            <p class="card-text mb-0"><i class="bi bi-bar-chart"> </i> <strong>Level:</strong> ${row.course_level}</p>
                                        </div>
                                        <div class="col">
                                            <p class="card-text mb-0"><strong><i class="bi bi-book"> </i> Total Sessions:</strong> ${row.total_sessions}</p>
                                            <p class="card-text mb-0"><strong><i class="bi bi-clock"> </i> Total Hours:</strong> ${row.total_hours}</p>
                                            <p class="card-text">${courseTypeText}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            `;
                container.appendChild(courseElement);
            });

            if (!hasResults) {
                container.innerHTML = '<p>No courses found.</p>';
            }

            // Update pagination
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.classList.add('page-button');
                pageButton.classList.add('btn');
                pageButton.classList.add('btn-primary');
                if (i === page) {
                    pageButton.classList.add('active');
                }
                pageButton.addEventListener('click', () => displayPage(i));
                paginationContainer.appendChild(pageButton);
            }
        }
    </script>


    <!--end of course list-->

</body>

</html>
